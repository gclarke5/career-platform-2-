# nginx site for the AWS EC2 server. Install as /etc/nginx/sites-available/career-platform,
# symlink it into sites-enabled, and remove the default site. Certbot adds the HTTPS blocks.

# The test hostname must never be indexed; the real domain sends no X-Robots-Tag (empty = omitted).
map $host $career_platform_robots {
    aws.gavinclarke.me "noindex, nofollow";
    default            "";
}

# Anything that isn't one of our names (the bare IP, scanners, other hosts) gets no response.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
}

server {
    listen 80;
    listen [::]:80;
    server_name gavinclarke.me aws.gavinclarke.me;

    server_tokens off;
    client_max_body_size 1m;
    add_header X-Robots-Tag $career_platform_robots always;

    # /admin is unauthenticated and only meant for local development; the app also hides it,
    # this is the second lock.
    location ^~ /admin {
        return 404;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
