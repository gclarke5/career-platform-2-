{% extends "base.html" %}
{% block title %}{{ project.title }} | Career Platform{% endblock %}
{% block content %}
<section class="container section">
  <h1>{{ project.title }}</h1>
  <p class="lede">{{ project.short_summary }}</p>
  <article class="card">
    <p>{{ project.description }}</p>
    <p><strong>Impact:</strong> {{ project.metrics }}</p>
    <p><strong>Tools:</strong> {{ project.tools }}</p>
  </article>
</section>
{% endblock %}
